server:
  port: 8025
  address: 0.0.0.0

spring:
  datasource:
    # Phase 5 分库：用户域只连 al_user（user / user_stats / user_tag）；
    # 账号、口令、驱动仍由 Nacos 共享配置 shared-mysql.yaml 注入，本地不写口令。
    url: jdbc:mysql://localhost:3306/al_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.user.mapper: debug

al:
  auth:
    # 网关不转发 /internal/**，这里放行给服务间 Feign 调用
    resource:
      exclude-login-paths:
        - /internal/**
    jwt:
      secret: ${AUTH_JWT_SECRET:}
      access-ttl: ${AUTH_ACCESS_TTL:1800}
      refresh-ttl: ${AUTH_REFRESH_TTL:604800}
      prev-grace: ${AUTH_PREV_GRACE:5}
      max-sessions: ${AUTH_MAX_SESSIONS:3}
      secure-cookie: ${AUTH_SECURE_COOKIE:false}
      legacy-compat: ${AUTH_LEGACY_COMPAT:true}
    # 登录失败限流（账号/IP 双维度）
    login:
      max-fail-per-user: ${AL_LOGIN_MAX_FAIL_USER:5}
      max-fail-per-ip: ${AL_LOGIN_MAX_FAIL_IP:20}
      window-seconds: ${AL_LOGIN_WINDOW:900}
  # 用户统计：粉丝/关注走 al-social，获赞/播放/投稿/收藏走 al-video；
  # 两个内部契约客户端默认 url 留空，走 Nacos 服务发现，不需要本地地址配置。
  user:
    # 默认收藏夹由 al-social 创建（本地开发直连 8031，可被环境变量覆盖）
    social-url: ${AL_SOCIAL_URL:http://localhost:8031}
