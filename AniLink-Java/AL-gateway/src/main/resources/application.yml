server:
  port: 8090  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  config:
    import: optional:classpath:routes.yml
  datasource:
    url: jdbc:mysql://localhost:3306/video?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8

# 与 AL-web 保持一致的 JWT 配置（密钥/有效期不同会导致"网关判过期、服务判合法"）
al:
  auth:
    jwt:
      # 必须 >=32 字节，且与 AL-web 的 AUTH_JWT_SECRET 完全相同；留空则回退默认常量
      secret: ${AUTH_JWT_SECRET:}
      access-ttl: ${AUTH_ACCESS_TTL:1800}
      refresh-ttl: ${AUTH_REFRESH_TTL:604800}
      legacy-compat: ${AUTH_LEGACY_COMPAT:true}
