server:
  port: 8031
  address: 0.0.0.0

spring:
  datasource:
    # Phase 5 分库：社交域只连 al_social（follow / favorite / favorite_video）；
    # 账号、口令、驱动仍由 Nacos 共享配置 shared-mysql.yaml 注入，本地不写口令。
    url: jdbc:mysql://localhost:3306/al_social?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.social.mapper: debug

al:
  auth:
    # 网关不转发 /internal/**，这里放行给服务间 Feign 调用
    resource:
      exclude-login-paths:
        - /internal/**
