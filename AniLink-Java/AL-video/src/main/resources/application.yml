server:
  port: 8026
  address: 0.0.0.0

spring:
  datasource:
    # Phase 5 分库：视频域只连 al_video（video / video_stats / user_video / category）；
    # 账号、口令、驱动仍由 Nacos 共享配置 shared-mysql.yaml 注入，本地不写口令。
    url: jdbc:mysql://localhost:3306/al_video?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
  # MQ 监听有限重试（运行态修正）：收藏事件等不可恢复的落库错误原先会因默认 requeue 无限重投，
  # 导致日志爆量+CPU 空转；这里限制为 3 次，超过后交给 MqConfig 的失败恢复器转入 error 队列。
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 3000ms
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.video.mapper: debug

video:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    accessKey: ${MINIO_ACCESSKEY}
    secretKey: ${MINIO_SECRETKEY}

al:
  auth:
    # 网关不转发 /internal/**，这里放行给服务间 Feign 调用
    resource:
      exclude-login-paths:
        - /internal/**
  # 视频播放分片加载（HLS）：投稿后异步转码，转完写 video.hls_url
  transcode:
    enabled: ${AL_TRANSCODE_ENABLED:true}
    ffmpeg-path: ${AL_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${AL_FFPROBE_PATH:}
    max-bitrate-kbps: ${AL_TRANSCODE_MAX_KBPS:6000}
    tmp-dir: ${AL_TRANSCODE_TMP:}
    preset: ${AL_TRANSCODE_PRESET:veryfast}
    crf: ${AL_TRANSCODE_CRF:21}
    segment-seconds: ${AL_TRANSCODE_SEGMENT:6}
    max-attempts: ${AL_TRANSCODE_ATTEMPTS:2}
    recover-on-start: ${AL_TRANSCODE_RECOVER:true}
    timeout-minutes: ${AL_TRANSCODE_TIMEOUT:60}
  image:
    enabled: ${AL_IMAGE_ENABLED:true}
    cover-quality: ${AL_IMAGE_COVER_QUALITY:78}
    avatar-size: ${AL_IMAGE_AVATAR_SIZE:192}
    max-cover-bytes: ${AL_IMAGE_MAX_COVER:5242880}
    max-avatar-bytes: ${AL_IMAGE_MAX_AVATAR:2097152}
    timeout-seconds: ${AL_IMAGE_TIMEOUT:30}
