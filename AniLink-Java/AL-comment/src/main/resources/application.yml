server:
  port: 8028
  address: 0.0.0.0

spring:
  datasource:
    # 评论表当前仍在 video 库；Phase 5 数据库拆分时再迁到独立库
    url: jdbc:mysql://localhost:3306/video?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.comment.mapper: debug

al:
  auth:
    # 网关不转发 /internal/**，这里放行给服务间 Feign 调用
    resource:
      exclude-login-paths:
        - /internal/**
