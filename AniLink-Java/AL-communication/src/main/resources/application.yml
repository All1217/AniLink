server:
  port: 8023
  tomcat:
    uri-encoding: UTF-8
spring:
  datasource:
    # Phase 5 分库：聊天域只连 al_communication（chat / chat_message）；
    # 账号、口令、驱动仍由 Nacos 共享配置 shared-mysql.yaml 注入，本地不写口令。
    url: jdbc:mysql://localhost:3306/al_communication?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.communication.chat.mapper: debug
# /chat 私信 WebSocket 端口；/video 房间已迁到 al-danmaku 的 8030
netty:
  port: 8024
