server:
  port: 8023
  tomcat:
    uri-encoding: UTF-8
spring:
  datasource:
    # chat / chat_message 表当前仍在 video 库；Phase 5 数据库拆分前保持原库，保证聊天记录可读写
    url: jdbc:mysql://localhost:3306/video?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.communication.chat.mapper: debug
# /chat 私信 WebSocket 端口；/video 房间已迁到 al-danmaku 的 8030
netty:
  port: 8024
