server:
  port: 8022
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/video?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

#用于打印框架生成的sql语句，便于调试
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.video.web.main.mapper: debug

video:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    accessKey: ${MINIO_ACCESSKEY}
    secretKey: ${MINIO_SECRETKEY}

netty:
  port: 5051

# 双令牌配置：时间单位秒；密钥建议由环境变量 AUTH_JWT_SECRET 注入
al:
  auth:
    jwt:
      # 必须 >=32 字节（HS256 要求 256bit，不足会启动失败），且与 AL-gateway 完全一致；
      # 留空则回退代码里的默认常量，生产环境务必注入随机值，不要提交进仓库
      secret: ${AUTH_JWT_SECRET:}
      access-ttl: ${AUTH_ACCESS_TTL:1800}        # 访问令牌 30 分钟
      refresh-ttl: ${AUTH_REFRESH_TTL:604800}    # 刷新令牌 7 天，每次续约重置
      prev-grace: ${AUTH_PREV_GRACE:5}           # 轮换宽限窗口
      max-sessions: ${AUTH_MAX_SESSIONS:3}       # 同一用户最多会话数
      secure-cookie: ${AUTH_SECURE_COOKIE:false} # HTTPS 部署请置为 true
      legacy-compat: ${AUTH_LEGACY_COMPAT:true}  # 兼容没有 typ 的旧令牌；收紧时置 false

